name: audio_rezumat_romania
description: "Aplicatie de audiobook-uri cu rezumate in limba romana."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Activeaza suportul pentru asset-uri daca vei avea imagini/audio locale
  # assets:
  #   - assets/images/
  #   - assets/audio/
