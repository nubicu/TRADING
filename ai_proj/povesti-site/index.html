<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Povești cu Tâlc - Lectură Completă</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0 h-100vh">
            <!-- Sidebar: Lista de povești -->
            <nav class="col-md-4 col-lg-3 bg-dark text-white d-flex flex-column sidebar-column">
                <div class="p-3 border-bottom border-secondary">
                    <h2 class="portfolio-title fs-4 mb-3 text-info"><i class="fa-solid fa-book-open me-2"></i>Povești cu Tâlc</h2>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-dark border-secondary text-white" placeholder="Caută...">
                    </div>
                </div>
                <div id="storyList" class="overflow-auto flex-grow-1 list-group list-group-flush custom-scrollbar">
                    <!-- Titlurile vor fi încărcate aici -->
                </div>
                <div class="p-2 bg-black text-center small text-muted">
                    Total: <span id="storyCount">0</span> povești
                </div>
            </nav>

            <!-- Main Content: Conținutul poveștii -->
            <main class="col-md-8 col-lg-9 d-flex flex-column bg-white content-column position-relative">
                
                <!-- Imagine de bun venit (Cartea) -->
                <div id="welcomeMessage" class="flex-grow-1 d-flex align-items-center justify-content-center p-5 text-center">
                    <div class="welcome-container">
                        <div class="book-icon-wrapper mb-4">
                            <i class="fa-solid fa-book-journal-whills display-1 text-info shadow-icon"></i>
                        </div>
                        <h1 class="portfolio-title display-5">Colecția de Povești</h1>
                        <p class="lead text-muted mx-auto" style="max-width: 500px;">Alege o poveste din biblioteca noastră virtuală pentru a începe călătoria în lumea înțelepciunii.</p>
                        <div class="mt-4">
                            <span class="badge bg-info text-dark px-3 py-2 rounded-pill">100 de povești disponibile</span>
                        </div>
                    </div>
                </div>

                <!-- Vizualizator Poveste -->
                <div id="storyViewer" class="d-none overflow-auto p-4 p-md-5 custom-scrollbar h-100">
                    <div class="max-width-content mx-auto">
                        <div id="storyContent">
                            <!-- Conținutul Markdown randat va apărea aici -->
                        </div>
                        <hr class="my-5">
                        <div class="text-center pb-5">
                            <button id="backToTopBtn" class="btn btn-outline-info rounded-pill px-4">
                                <i class="fa-solid fa-arrow-up me-2"></i>Înapoi sus
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Marked.js pentru Markdown -> HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Story Data -->
    <script src="static/js/stories.js"></script>
    <!-- Logic Script -->
    <script src="static/js/script.js"></script>
</body>
</html>
