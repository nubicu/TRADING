{% extends "base.html" %}
{% block title %}Comenzile Mele - ShopAll{% endblock %}
{% block content %}
<div class="container">
    <h2 class="section-title mb-4"><i class="fas fa-box me-2"></i>Comenzile Mele</h2>
    <div id="ordersContainer">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
</div>
<script>
async function loadOrders() {
    const token = getToken();
    if (!token) { window.location.href = '/login'; return; }
    const res = await apiRequest('/api/orders/', 'GET', null, true);
    if (!res || !res.ok) return;
    const orders = await res.json();
    const container = document.getElementById('ordersContainer');
    
    if (orders.length === 0) {
        container.innerHTML = `<div class="text-center py-5">
            <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
            <h4 class="text-muted">Nu ai comenzi încă</h4>
            <a href="/" class="btn btn-primary mt-3">Începe să cumperi</a>
        </div>`;
        return;
    }
    
    container.innerHTML = orders.map(order => {
        const statusClass = { paid:'status-paid', pending:'status-pending', shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled' }[order.status] || 'status-pending';
        const statusLabel = { paid:'Plătit', pending:'În așteptare', shipped:'Expediat', delivered:'Livrat', cancelled:'Anulat' }[order.status] || order.status;
        const items = order.items.map(i => `
            <div class="d-flex align-items-center gap-3 mb-2">
                <img src="${i.product.image_url || 'https://via.placeholder.com/50'}" style="width:50px;height:50px;object-fit:cover;border-radius:8px">
                <div>
                    <p class="mb-0 fw-semibold small">${i.product.name}</p>
                    <p class="text-muted small mb-0">${i.quantity} × ${i.price.toFixed(2)} Lei</p>
                </div>
            </div>`).join('');
        
        return `<div class="order-card mb-4">
            <div class="d-flex justify-content-between align-items-center p-4 border-bottom flex-wrap gap-2">
                <div>
                    <span class="text-muted small">Comanda #${order.id}</span>
                    <p class="mb-0 fw-semibold">${new Date(order.created_at).toLocaleDateString('ro-RO', {day:'numeric',month:'long',year:'numeric'})}</p>
                </div>
                <div class="text-center">
                    <span class="order-status ${statusClass}">${statusLabel}</span>
                </div>
                <div class="text-end">
                    <p class="text-muted small mb-0">Total</p>
                    <strong class="text-primary fs-5">${order.total.toFixed(2)} Lei</strong>
                </div>
            </div>
            <div class="p-4">
                ${items}
                <div class="mt-3 pt-3 border-top">
                    <small class="text-muted"><i class="fas fa-map-marker-alt me-1"></i>${order.shipping_address}</small>
                    <small class="text-muted ms-3"><i class="fas fa-credit-card me-1"></i>${order.payment_method === 'stripe' ? 'Card bancar' : 'PayPal'}</small>
                </div>
            </div>
        </div>`;
    }).join('');
}
document.addEventListener('DOMContentLoaded', loadOrders);
</script>
{% endblock %}
